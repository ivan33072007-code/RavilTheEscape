<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adventure 2D - Day/Night & Audio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; background: #2d5a27; }
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  
  #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-weight: bold; font-size: 18px; text-shadow: 0 2px 4px #000; pointer-events: none; }
  #hud div { margin-bottom: 5px; }
  .stat-value { color: #f1c40f; }
  #hud-mission { color: #2ecc71; margin-top: 10px; display: none; text-shadow: 0 0 5px #000; }

  #stamina-label { font-size: 12px; color: #aaa; margin-top: 8px; margin-bottom: 2px; }
  #stamina-container { width: 150px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #555; border-radius: 5px; overflow: hidden; }
  #stamina-bar { width: 100%; height: 100%; background: #e67e22; transition: width 0.1s; }

  #fuel-label { font-size: 12px; color: #aaa; margin-top: 8px; margin-bottom: 2px; }
  #fuel-container { width: 150px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #555; border-radius: 5px; overflow: hidden; display: none; }
  #fuel-bar { width: 100%; height: 100%; background: #3498db; transition: width 0.1s; }

  /* Часы в углу */
  #clock { position: absolute; bottom: 30px; right: 30px; color: #fff; font-weight: bold; font-size: 28px; text-shadow: 0 2px 10px #000; pointer-events: none; letter-spacing: 2px; }

  #settings-btn { position: absolute; top: 20px; right: 20px; pointer-events: auto; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.2s; }
  #settings-btn:hover { background: #fff; color: #000; }
  
  #settings-panel { position: absolute; top: 80px; right: 20px; pointer-events: auto; background: rgba(15, 15, 20, 0.95); border: 2px solid #f1c40f; border-radius: 10px; padding: 20px; color: #fff; display: none; flex-direction: column; gap: 10px; z-index: 200; width: 340px; }
  #settings-panel h3 { color: #f1c40f; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .control-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; align-items: center; }
  .key { background: #333; padding: 2px 8px; border-radius: 4px; border: 1px solid #555; font-weight: bold; color: #f1c40f; }
  input[type=range] { width: 120px; cursor: pointer; }

  #interaction-hint { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #f1c40f; padding: 10px 20px; border-radius: 20px; font-weight: bold; border: 1px solid #f1c40f; display: none; pointer-events: auto; text-shadow: 0 1px 2px #000; text-align: center; }

  .panel { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: rgba(15, 15, 20, 0.95); border: 2px solid #f1c40f; border-radius: 10px; padding: 20px; color: #fff; display: none; flex-direction: column; gap: 15px; pointer-events: auto; z-index: 100; }
  .panel-title { font-size: 20px; color: #f1c40f; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .panel-text { font-size: 16px; line-height: 1.5; }
  .panel-buttons { display: flex; flex-direction: column; gap: 10px; }
  .btn { background: #333; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 5px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 14px; }
  .btn:hover { background: #444; border-color: #fff; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<audio id="bg-music" loop src="music1.mp3"></audio>

<div id="ui-layer">
  <div id="hud">
    <div>Деньги: <span class="stat-value" id="hud-money">1000</span> ₽</div>
    <div>Настроение: <span class="stat-value" id="hud-mood">50</span>%</div>
    <div id="stamina-label">Выносливость:</div>
    <div id="stamina-container"><div id="stamina-bar"></div></div>
    <div id="fuel-label">Бензин:</div>
    <div id="fuel-container"><div id="fuel-bar"></div></div>
    <div id="hud-mission">Пассажир: Егор (Следуйте по стрелке)</div>
  </div>

  <div id="clock">06:00</div>

  <button id="settings-btn" onclick="toggleSettings()">⚙️</button>

  <div id="settings-panel">
    <h3>Настройки</h3>
    <div class="control-row"><span>Движение:</span> <span><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></span></div>
    <div class="control-row"><span>Бег:</span> <span><span class="key">Shift</span></span></div>
    <div class="control-row"><span>Завести / Заглушить:</span> <span><span class="key">Q</span></span></div>
    <div class="control-row"><span>Музыка (Вкл/Выкл):</span> <span><span class="key">M</span></span></div>
    <div class="control-row"><span>Действие / Позвать:</span> <span><span class="key">E</span> / <span class="key">Пробел</span></span></div>
    <div class="control-row"><span>Выйти из машины:</span> <span><span class="key">F</span></span></div>
    
    <div class="control-row" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
      <span>Музыка:</span> <input type="range" id="vol-music" min="0" max="1" step="0.05" value="0.3">
    </div>
    <div class="control-row">
      <span>Звук игры:</span> <input type="range" id="vol-game" min="0" max="1" step="0.05" value="0.5">
    </div>
  </div>

  <div id="interaction-hint">Нажмите [E]</div>

  <div class="panel" id="dialogue-panel">
    <div class="panel-title" id="dialogue-title">Диалог</div>
    <div class="panel-text" id="dialogue-text"></div>
    <div class="panel-buttons" id="dialogue-choices"></div>
  </div>

  <div class="panel" id="shop-panel">
    <div class="panel-title" id="shop-title">Меню</div>
    <div class="panel-buttons" id="shop-items"></div>
    <button class="btn" style="margin-top: 10px; text-align: center; border-color: #e74c3c;" onclick="closeShop()">Закрыть</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const bgMusic = document.getElementById('bg-music');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  // --- ВРЕМЯ И ДЕНЬ/НОЧЬ ---
  const DAY_DURATION = 10 * 60 * 1000; // 10 минут
  const NIGHT_DURATION = 5 * 60 * 1000; // 5 минут
  const TOTAL_CYCLE = DAY_DURATION + NIGHT_DURATION;
  const gameStartTime = Date.now();

  function getTimeData() {
    let elapsed = Date.now() - gameStartTime;
    let cycleTime = elapsed % TOTAL_CYCLE;
    let isNight = false;
    let alpha = 0;
    let gameHour = 0;

    if (cycleTime < DAY_DURATION) {
      let progress = cycleTime / DAY_DURATION;
      gameHour = 6 + progress * 12; // 06:00 - 18:00
      if (progress < 0.05) alpha = (0.05 - progress) / 0.05 * 0.75;
      else if (progress > 0.95) alpha = (progress - 0.95) / 0.05 * 0.75;
      isNight = false;
    } else {
      let progress = (cycleTime - DAY_DURATION) / NIGHT_DURATION;
      gameHour = 18 + progress * 12; // 18:00 - 06:00
      if (gameHour >= 24) gameHour -= 24;
      alpha = 0.75;
      if (progress < 0.1) alpha = 0.75 * (progress / 0.1);
      else if (progress > 0.9) alpha = 0.75 * (1 - (progress - 0.9) / 0.1);
      isNight = true;
    }

    let h = Math.floor(gameHour).toString().padStart(2, '0');
    let m = Math.floor((gameHour % 1) * 60).toString().padStart(2, '0');
    return { isNight, alpha, timeString: `${h}:${m}` };
  }

  // --- АУДИО СИСТЕМА ---
  let audioCtx, masterGain, engineOsc1, engineOsc2, engineGain, engineFilter;
  let ambientOsc, ambientGain;
  
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);

      // Двигатель
      engineOsc1 = audioCtx.createOscillator();
      engineOsc2 = audioCtx.createOscillator();
      engineGain = audioCtx.createGain();
      engineFilter = audioCtx.createBiquadFilter();
      engineOsc1.type = 'sawtooth'; engineOsc2.type = 'square'; engineOsc2.detune.value = 15; 
      engineFilter.type = 'lowpass'; engineFilter.frequency.value = 400;
      engineOsc1.connect(engineFilter); engineOsc2.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(masterGain);
      engineOsc1.start(); engineOsc2.start(); engineGain.gain.value = 0;

      // Фоновый шум улицы (Ветер/Гул)
      ambientOsc = audioCtx.createOscillator();
      ambientGain = audioCtx.createGain();
      ambientOsc.type = 'triangle';
      ambientOsc.frequency.value = 60; // Низкий гул
      ambientGain.gain.value = 0.05; // Тихо
      ambientOsc.connect(ambientGain);
      ambientGain.connect(masterGain);
      ambientOsc.start();
    }
  }

  function playFootstep() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
    filter.type = 'lowpass';
    filter.frequency.value = 300;
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    
    osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
    osc.start(now); osc.stop(now + 0.1);
  }

  document.getElementById('vol-music').addEventListener('input', (e) => { bgMusic.volume = e.target.value; });
  document.getElementById('vol-game').addEventListener('input', (e) => { if(masterGain) masterGain.gain.value = e.target.value; });

  function startEngineSound() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    engineGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.2);
  }

  function stopEngineSound() {
    if (engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
  }

  function updateEngineSound(speed) {
    if (!audioCtx || !engineOsc1) return;
    const baseFreq = 50;
    const maxFreq = 250;
    const freq = baseFreq + (Math.abs(speed) / 20) * (maxFreq - baseFreq);
    engineOsc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
    engineOsc2.frequency.setTargetAtTime(freq * 0.5, audioCtx.currentTime, 0.1);
    engineFilter.frequency.setTargetAtTime(300 + (Math.abs(speed) * 30), audioCtx.currentTime, 0.1);
  }

  // --- ЧАСТИЦЫ ---
  let particles = [];
  let skidmarks = [];
  let fuelAlertShown = false;

  function playExhaustPop() {
    initAudio();
    if(!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(20, now + 0.15);
    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(1.5, now);
    oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    const bufferSize = audioCtx.sampleRate * 0.1;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(1000, now);
    noiseFilter.frequency.exponentialRampToValueAtTime(200, now + 0.1);
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(1.0, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.connect(oscGain); oscGain.connect(masterGain);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);
    osc.start(now); osc.stop(now + 0.2);
    noise.start(now); noise.stop(now + 0.1);
    const rearX = car.x - Math.cos(car.angle) * (car.width/2);
    const rearY = car.y - Math.sin(car.angle) * (car.height/2);
    for(let i=0; i<15; i++) {
      particles.push({ x: rearX + (Math.random() - 0.5) * 20, y: rearY + (Math.random() - 0.5) * 20, vx: -Math.cos(car.angle) * 8 + (Math.random() - 0.5) * 6, vy: -Math.sin(car.angle) * 8 + (Math.random() - 0.5) * 6, life: 1.0, size: 10 + Math.random() * 15, color: Math.random() > 0.5 ? '#ff5500' : '#ffaa00' });
    }
  }

  const WORLD_SIZE = 10000; 
  const ROAD_WIDTH = 300;
  const roadsX = [2500, 5000, 7500];
  const roadsY = [2500, 5000, 7500];

  let gameState = { inCar: false, activePanel: null };
  let stats = { money: 1000, mood: 50 };
  let mission = { active: false, destX: 0, destY: 0 };

  const player = { x: 5000, y: 5300, angle: -Math.PI/2, speed: 0, walkSpeed: 1.0, sprintSpeed: 2.0, accel: 0.08, friction: 0.85, turnSpeed: 0.15, color: '#3498db', name: "Равиль", walkCycle: 0, stamina: 100, maxStamina: 100, isSprinting: false, radius: 18, lastStepTrigger: 0 };
  
  const egor = { x: 4900, y: 5200, speed: 1.5, color: '#e74c3c', name: "Егор", state: 'idle', walkCycle: 0, angle: 0, radius: 18 };
  
  const car = { x: 5000, y: 5000, angle: -Math.PI/2, vx: 0, vy: 0, speed: 0, maxSpeed: 22, accel: 0.22, turnSpeed: 0.05, grip: 0.15, drag: 0.97, width: 150, height: 75, color: '#0a0a0a', isEngineOn: false, lastGear: 0, fuel: 100, maxFuel: 100 };
  
  const camera = { x: 0, y: 0 };
  const keys = {};

  const trees = [];
  const bushes = [];
  const lights = [];
  const shops = [
    { id: 'coffee', x: 5300, y: 2100, w: 200, h: 150, name: "Кофейня", color: "#8e44ad", type: 'food', items: [{ name: "Кофе", price: 150, mood: 15 }] },
    { id: 'shawarma', x: 1950, y: 5300, w: 250, h: 200, name: "Шаурмичная", color: "#d35400", type: 'food', items: [{ name: "Шаурма", price: 300, mood: 30 }] },
    { id: 'gas', x: 7700, y: 2300, w: 200, h: 150, name: "Заправка", color: "#27ae60", type: 'gas' },
    { id: 'garage', x: 2100, y: 7700, w: 250, h: 200, name: "Автосервис", color: "#7f8c8d", type: 'garage' }
  ];

  function isOnRoad(x, y) {
    for (let rx of roadsX) { if (Math.abs(x - rx) < ROAD_WIDTH/2 + 50) return true; }
    for (let ry of roadsY) { if (Math.abs(y - ry) < ROAD_WIDTH/2 + 50) return true; }
    return false;
  }

  function initWorld() {
    for(let i=0; i<800; i++) {
      let tx = Math.random() * WORLD_SIZE; let ty = Math.random() * WORLD_SIZE;
      if (!isOnRoad(tx, ty)) trees.push({ x: tx, y: ty, r: 30 + Math.random()*20 });
    }
    for(let i=0; i<600; i++) {
      let bx = Math.random() * WORLD_SIZE; let by = Math.random() * WORLD_SIZE;
      if (!isOnRoad(bx, by)) bushes.push({ x: bx, y: by, r: 15 + Math.random()*10 });
    }
    const lightOffset = ROAD_WIDTH/2 + 50; const step = 400;
    for (let rx of roadsX) {
      for (let y = 0; y < WORLD_SIZE; y += step) {
        let isIntersection = false;
        for (let ry of roadsY) { if (Math.abs(y - ry) < lightOffset) isIntersection = true; }
        if (!isIntersection) { lights.push({ x: rx - lightOffset, y: y }); lights.push({ x: rx + lightOffset, y: y }); }
      }
    }
    for (let ry of roadsY) {
      for (let x = 0; x < WORLD_SIZE; x += step) {
        let isIntersection = false;
        for (let rx of roadsX) { if (Math.abs(x - rx) < lightOffset) isIntersection = true; }
        if (!isIntersection) { lights.push({ x: x, y: ry - lightOffset }); lights.push({ x: x, y: ry + lightOffset }); }
      }
    }
  }
  initWorld();

  window.addEventListener('blur', () => { for(let k in keys) keys[k] = false; });
  window.addEventListener('mouseup', () => { for(let k in keys) keys[k] = false; });

  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    keys[key] = true;
    if (key === ' ' || key === 'e' || key === 'у') { if (!gameState.activePanel) interact(); e.preventDefault(); }
    if (key === 'f' || key === 'а') { if (!gameState.activePanel) exitCarOrEject(); e.preventDefault(); }
    if (key === 'q' || key === 'й') { if (gameState.inCar && !gameState.activePanel) toggleEngine(); e.preventDefault(); }
    if (key === 'm' || key === 'ь') { if (gameState.inCar) bgMusic.muted = !bgMusic.muted; e.preventDefault(); }
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  function isUp() { return keys['w'] || keys['ц'] || keys['arrowup']; }
  function isDown() { return keys['s'] || keys['ы'] || keys['arrowdown']; }
  function isLeft() { return keys['a'] || keys['ф'] || keys['arrowleft']; }
  function isRight() { return keys['d'] || keys['в'] || keys['arrowright']; }

  function toggleSettings() {
    const p = document.getElementById('settings-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  }

  function updateHUD() {
    document.getElementById('hud-money').textContent = stats.money;
    document.getElementById('hud-mood').textContent = stats.mood;
    document.getElementById('hud-mission').style.display = mission.active ? 'block' : 'none';
    document.getElementById('stamina-bar').style.width = (player.stamina / player.maxStamina * 100) + '%';
    document.getElementById('stamina-bar').style.background = player.stamina < 30 ? '#e74c3c' : '#e67e22';
    
    document.getElementById('fuel-container').style.display = gameState.inCar ? 'block' : 'none';
    document.getElementById('fuel-label').style.display = gameState.inCar ? 'block' : 'none';
    if (gameState.inCar) {
      document.getElementById('fuel-bar').style.width = (car.fuel / car.maxFuel * 100) + '%';
      document.getElementById('fuel-bar').style.background = car.fuel < 20 ? '#e74c3c' : '#3498db';
    }
    
    let timeData = getTimeData();
    document.getElementById('clock').textContent = timeData.timeString;
  }

  function toggleEngine() {
    if (car.fuel <= 0) { alert("Нет бензина! Нужно заправиться."); return; }
    car.isEngineOn = !car.isEngineOn;
    if (car.isEngineOn) {
      startEngineSound();
      if (!bgMusic.muted) bgMusic.play().catch(e => {});
      fuelAlertShown = false; // Сброс флага
    } else {
      stopEngineSound(); bgMusic.pause();
    }
  }

  function interact() {
    if (gameState.activePanel) return;
    if (gameState.inCar) {
      const dist = Math.hypot(car.x - egor.x, car.y - egor.y);
      if (egor.state === 'idle' && dist < 250) { egor.state = 'walking'; return; }
    }
    for(let shop of shops) {
      if (player.x > shop.x - 40 && player.x < shop.x + shop.w + 40 && player.y > shop.y - 40 && player.y < shop.y + shop.h + 40) { openShop(shop); return; }
    }
    if (!gameState.inCar) {
      const distToCar = Math.hypot(player.x - car.x, player.y - car.y);
      if (distToCar < 160) { gameState.inCar = true; return; }
      const distToEgor = Math.hypot(player.x - egor.x, player.y - egor.y);
      if (distToEgor < 80) {
        openDialogue("Егор: — Ну чего тебе?", [
          { text: "Поехали кататься, подвезу!", action: () => { egor.state = 'walking'; closeDialogue(); } },
          { text: "Отстань.", action: () => closeDialogue() }
        ]);
      }
    }
  }

  function exitCarOrEject() {
    if (gameState.activePanel) return;
    if (gameState.inCar) {
      if (egor.state === 'inCar') { egor.state = 'idle'; egor.x = car.x + 80; egor.y = car.y + 80; mission.active = false; }
      else {
        gameState.inCar = false; car.speed = 0; car.vx = 0; car.vy = 0; car.isEngineOn = false;
        stopEngineSound(); bgMusic.pause();
        player.x = car.x + Math.cos(car.angle + Math.PI/2) * 90; player.y = car.y + Math.sin(car.angle + Math.PI/2) * 90;
      }
    }
  }

  // ==========================================
  // ИДЕАЛЬНЫЕ КОЛЛИЗИИ (3 КРУГА НА МАШИНУ)
  // ==========================================
  
  function getCarCircles() {
    return [
      { x: car.x + Math.cos(car.angle) * 45, y: car.y + Math.sin(car.angle) * 45, r: 35 }, // Перед
      { x: car.x, y: car.y, r: 38 }, // Центр
      { x: car.x - Math.cos(car.angle) * 45, y: car.y - Math.sin(car.angle) * 45, r: 35 }  // Зад
    ];
  }

  function isCircleHittingCar(cx, cy, radius) {
    for (let c of getCarCircles()) {
      if (Math.hypot(cx - c.x, cy - c.y) < c.r + radius) return true;
    }
    return false;
  }

  function isHittingEgor(cx, cy, radius) {
    if (egor.state === 'inCar') return false;
    if (Math.hypot(cx - egor.x, cy - egor.y) < radius + egor.radius) return true;
    if (Math.hypot(cx - egor.x, cy - (egor.y - 25)) < radius + 15) return true;
    return false;
  }

  function egorHitsCar() {
    return isCircleHittingCar(egor.x, egor.y, egor.radius) || isCircleHittingCar(egor.x, egor.y - 25, 15);
  }

  function carHitsShop() {
    for (let s of shops) {
      if (car.x > s.x && car.x < s.x + s.w && car.y > s.y && car.y < s.y + s.h) return true;
      for (let c of getCarCircles()) {
        let closestX = Math.max(s.x, Math.min(c.x, s.x + s.w));
        let closestY = Math.max(s.y, Math.min(c.y, s.y + s.h));
        if ((c.x - closestX)**2 + (c.y - closestY)**2 < c.r**2) return true;
      }
    }
    return false;
  }

  function checkAllCarCollisions() {
    if (carHitsShop()) return true;
    if (isHittingEgor(car.x, car.y, 10)) return true;
    return false;
  }

  function update() {
    if (gameState.activePanel) return;

    for(let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.04;
      if(p.life <= 0) particles.splice(i, 1);
    }
    for(let i = skidmarks.length - 1; i >= 0; i--) {
      skidmarks[i].life -= 0.01;
      if(skidmarks[i].life <= 0) skidmarks.splice(i, 1);
    }

    if (egor.state === 'walking') {
      let doorX = car.x + Math.cos(car.angle + Math.PI/2) * 60;
      let doorY = car.y + Math.sin(car.angle + Math.PI/2) * 60;
      let dx = doorX - egor.x; let dy = doorY - egor.y;
      let dist = Math.hypot(dx, dy);
      
      if (dist > 20) {
        let stepX = (dx / dist) * egor.speed; let stepY = (dy / dist) * egor.speed;
        egor.x += stepX; if (egorHitsCar()) egor.x -= stepX;
        egor.y += stepY; if (egorHitsCar()) egor.y -= stepY;
        egor.walkCycle += egor.speed * 0.15; egor.angle = Math.atan2(dy, dx);
      } else {
        egor.state = 'inCar'; mission.active = true;
        let safeDist = false;
        while(!safeDist) {
          if (Math.random() > 0.5) { mission.destX = roadsX[Math.floor(Math.random() * roadsX.length)]; mission.destY = Math.random() * WORLD_SIZE; }
          else { mission.destX = Math.random() * WORLD_SIZE; mission.destY = roadsY[Math.floor(Math.random() * roadsY.length)]; }
          if (Math.hypot(mission.destX - car.x, mission.destY - car.y) > 4000) safeDist = true;
        }
      }
    } else { egor.walkCycle = 0; }

    if (mission.active && gameState.inCar) {
      if (Math.hypot(car.x - mission.destX, car.y - mission.destY) < 150) {
        mission.active = false; stats.money += 500; stats.mood += 10;
        egor.state = 'idle'; egor.x = car.x + 80; egor.y = car.y + 80;
        alert("Вы довезли Егора! Получено 500 ₽.");
      }
    }

    if (gameState.inCar) {
      if (car.isEngineOn) {
        // ОЧЕНЬ МЕДЛЕННЫЙ РАСХОД ТОПЛИВА
        car.fuel -= 0.001 + (Math.abs(car.speed) * 0.0005);
        if (car.fuel <= 0) {
          car.fuel = 0; car.isEngineOn = false; car.speed = 0; car.vx = 0; car.vy = 0;
          stopEngineSound(); bgMusic.pause();
          if (!fuelAlertShown) { alert("Бензин кончился! Машина заглохла."); fuelAlertShown = true; }
        }

        let engineForce = 0;
        if (isUp()) engineForce = car.accel;
        if (isDown()) engineForce = -car.accel * 0.6;

        car.vx += Math.cos(car.angle) * engineForce; car.vy += Math.sin(car.angle) * engineForce;
        car.speed = car.vx * Math.cos(car.angle) + car.vy * Math.sin(car.angle);
        
        if (Math.abs(car.speed) > 0.5) {
          let turnFactor = Math.min(1, Math.abs(car.speed) / 15); let currentTurn = car.turnSpeed * turnFactor;
          if (isLeft()) car.angle -= currentTurn * (car.speed > 0 ? 1 : -1);
          if (isRight()) car.angle += currentTurn * (car.speed > 0 ? 1 : -1);
        }

        let forwardX = Math.cos(car.angle); let forwardY = Math.sin(car.angle);
        let rightX = Math.cos(car.angle + Math.PI/2); let rightY = Math.sin(car.angle + Math.PI/2);
        let vForward = car.vx * forwardX + car.vy * forwardY; let vLateral = car.vx * rightX + car.vy * rightY;

        if (Math.abs(vLateral) > 2 && Math.abs(car.speed) > 3) skidmarks.push({ x: car.x, y: car.y, angle: car.angle, life: 1 });
        vLateral *= car.grip; vForward *= 0.99; 
        car.vx = vForward * forwardX + vLateral * rightX; car.vy = vForward * forwardY + vLateral * rightY;
        car.vx *= car.drag; car.vy *= car.drag;

        let currentSpeed = Math.hypot(car.vx, car.vy);
        if (currentSpeed > car.maxSpeed) { car.vx = (car.vx / currentSpeed) * car.maxSpeed; car.vy = (car.vy / currentSpeed) * car.maxSpeed; }

        let gear = Math.floor(currentSpeed / 3);
        if (gear > car.lastGear && car.speed > 0) playExhaustPop();
        car.lastGear = gear;

        let oldX = car.x; car.x += car.vx;
        if (checkAllCarCollisions()) { car.x = oldX; car.vx *= -0.2; }
        let oldY = car.y; car.y += car.vy;
        if (checkAllCarCollisions()) { car.y = oldY; car.vy *= -0.2; }

        updateEngineSound(currentSpeed);
      } else { car.speed = 0; car.vx = 0; car.vy = 0; car.lastGear = 0; }
      player.x = car.x; player.y = car.y; player.stamina = Math.min(player.maxStamina, player.stamina + 1);
    } else {
      let dx = 0, dy = 0;
      if (isUp()) dy -= 1; if (isDown()) dy += 1; if (isLeft()) dx -= 1; if (isRight()) dx += 1;
      
      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy); dx /= len; dy /= len;
        let targetAngle = Math.atan2(dy, dx); let angleDiff = targetAngle - player.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2; while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        if (Math.abs(angleDiff) > 0.05) player.angle += angleDiff * player.turnSpeed; else player.angle = targetAngle;
        
        if (keys['shift'] && player.stamina > 0) {
          player.isSprinting = true; player.stamina -= 0.8; player.speed += player.accel;
          if (player.speed > player.sprintSpeed) player.speed = player.sprintSpeed;
        } else {
          player.isSprinting = false; player.speed += player.accel;
          if (player.speed > player.walkSpeed) player.speed = player.walkSpeed;
        }
        player.walkCycle += player.speed * 0.3;

        // Звук шагов
        let currentSin = Math.sin(player.walkCycle);
        if (Math.abs(currentSin) > 0.9 && Math.abs(player.lastStepTrigger) <= 0.9) {
            playFootstep();
        }
        player.lastStepTrigger = currentSin;

      } else {
        player.isSprinting = false; player.speed *= player.friction;
        if (player.speed < 0.1) player.speed = 0;
        player.walkCycle = 0; player.stamina = Math.min(player.maxStamina, player.stamina + 0.5);
      }

      if (!player.isSprinting && player.stamina < player.maxStamina) player.stamina = Math.min(player.maxStamina, player.stamina + 0.3);

      let nextX = player.x + Math.cos(player.angle) * player.speed; let nextY = player.y + Math.sin(player.angle) * player.speed;
      let hitX = false; player.x = nextX;
      for (let s of shops) {
        let closestX = Math.max(s.x, Math.min(player.x, s.x + s.w)); let closestY = Math.max(s.y, Math.min(player.y, s.y + s.h));
        if ((player.x - closestX)**2 + (player.y - closestY)**2 < player.radius**2) hitX = true;
      }
      if (isCircleHittingCar(player.x, player.y, player.radius)) hitX = true;
      if (isHittingEgor(player.x, player.y, player.radius)) hitX = true;
      if (hitX) player.x -= Math.cos(player.angle) * player.speed;

      let hitY = false; player.y = nextY;
      for (let s of shops) {
        let closestX = Math.max(s.x, Math.min(player.x, s.x + s.w)); let closestY = Math.max(s.y, Math.min(player.y, s.y + s.h));
        if ((player.x - closestX)**2 + (player.y - closestY)**2 < player.radius**2) hitY = true;
      }
      if (isCircleHittingCar(player.x, player.y, player.radius)) hitY = true;
      if (isHittingEgor(player.x, player.y, player.radius)) hitY = true;
      if (hitY) player.y -= Math.sin(player.angle) * player.speed;
    }

    if (player.x < 0) player.x = 0; if (player.y < 0) player.y = 0;
    if (player.x > WORLD_SIZE) player.x = WORLD_SIZE; if (player.y > WORLD_SIZE) player.y = WORLD_SIZE;
    if (car.x < 0) car.x = 0; if (car.y < 0) car.y = 0;
    if (car.x > WORLD_SIZE) car.x = WORLD_SIZE; if (car.y > WORLD_SIZE) car.y = WORLD_SIZE;

    camera.x = player.x - W / 2; camera.y = player.y - H / 2;
    if (camera.x < 0) camera.x = 0; if (camera.y < 0) camera.y = 0;
    if (camera.x > WORLD_SIZE - W) camera.x = WORLD_SIZE - W;
    if (camera.y > WORLD_SIZE - H) camera.y = WORLD_SIZE - H;

    updateInteractionHint();
  }

  function updateInteractionHint() {
    const hint = document.getElementById('interaction-hint');
    if (gameState.activePanel) { hint.style.display = 'none'; return; }
    let text = "";
    if (gameState.inCar) {
      const dist = Math.hypot(car.x - egor.x, car.y - egor.y);
      if (!car.isEngineOn && car.fuel > 0) text = "Нажмите [Q] чтобы завести двигатель";
      else if (car.fuel <= 0) text = "Бензин закончился! Выходите [F]";
      else if (egor.state === 'idle' && dist < 250) text = "Нажмите [E] чтобы позвать Егора";
      else if (egor.state === 'inCar') text = "Нажмите [F] высадить | [M] Музыка";
      else text = "Нажмите [F] выйти | [M] Музыка";
    } else {
      const distToCar = Math.hypot(player.x - car.x, player.y - car.y);
      const distToEgor = Math.hypot(player.x - egor.x, player.y - egor.y);
      let inShop = false;
      shops.forEach(s => { if (player.x > s.x - 40 && player.x < s.x + s.w + 40 && player.y > s.y - 40 && player.y < s.y + s.h + 40) inShop = true; });
      if (inShop) text = "Нажмите [E] чтобы войти";
      else if (distToCar < 160) text = "Нажмите [E] чтобы сесть в машину";
      else if (distToEgor < 80) text = "Нажмите [E] чтобы заговорить";
    }
    if (text) { hint.innerHTML = text; hint.style.display = 'block'; } else { hint.style.display = 'none'; }
  }

  function drawHuman(x, y, color, name, walkCycle, isRavil, angle) {
    ctx.save(); ctx.translate(x, y); 
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 9, 0, 0, Math.PI*2); ctx.fill();
    let safeAngle = isNaN(angle) ? -Math.PI/2 : angle; let a = (safeAngle + Math.PI * 2) % (Math.PI * 2); let angleDeg = a * 180 / Math.PI;
    let dir = 3; if (angleDeg >= 45 && angleDeg < 135) dir = 0; else if (angleDeg >= 135 && angleDeg < 225) dir = 1; else if (angleDeg >= 225 && angleDeg < 315) dir = 2; 
    let swing = Math.sin(walkCycle) * 0.6;

    ctx.fillStyle = '#2c3e50'; 
    if (dir === 0) {
      ctx.save(); ctx.translate(-6, -8); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(6, -8); ctx.rotate(-swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
    } else if (dir === 2) {
      ctx.save(); ctx.translate(-6, -8); ctx.rotate(-swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(6, -8); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
    } else { ctx.save(); ctx.translate(0, -6); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-7, 0, 14, 12, 3); ctx.fill(); ctx.restore(); }

    ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-12, -34, 24, 26, 6); ctx.fill(); 
    ctx.fillStyle = '#fcd0b3'; 
    if (dir === 0 || dir === 2) {
      ctx.save(); ctx.translate(-14, -28); ctx.rotate(-swing); ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 4); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(14, -28); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 4); ctx.fill(); ctx.restore();
    } else { ctx.save(); ctx.translate(-10, -26); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 4); ctx.fill(); ctx.restore(); }

    ctx.fillStyle = '#fcd0b3'; ctx.beginPath(); ctx.arc(0, -46, 14, 0, Math.PI*2); ctx.fill();
    if (isRavil) {
        ctx.fillStyle = '#111';
        if (dir === 0) { ctx.beginPath(); ctx.arc(0, -48, 14, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.roundRect(-10, -48, 20, 7, 3); ctx.fill(); }
        else if (dir === 2) { ctx.beginPath(); ctx.arc(0, -48, 14, Math.PI, 0); ctx.fill(); }
        else { ctx.beginPath(); ctx.roundRect(dir === 3 ? 2 : -14, -48, 12, 7, 3); ctx.fill(); ctx.beginPath(); ctx.arc(0, -48, 14, Math.PI, 0); ctx.fill(); }
    } else {
        ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.arc(-4, -50, 10, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(4, -48, 10, Math.PI, 0); ctx.fill();
        if (dir === 0) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-5, -48, 2, 0, Math.PI*2); ctx.arc(5, -48, 2, 0, Math.PI*2); ctx.fill(); }
        else if (dir === 3) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(8, -48, 2, 0, Math.PI*2); ctx.fill(); }
        else if (dir === 1) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-8, -48, 2, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText(name, x, y - 75);
  }

        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(l.x, l.y - 20, 60, 0, Math.PI*2); ctx.fill();

    });

    shops.forEach(s => {
      if (s.x > camera.x - 300 && s.x < camera.x + W + 300 && s.y > camera.y - 300 && s.y < camera.y + H + 300) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(s.x + 15, s.y + 15, s.w, s.h);
        ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(s.x - 10, s.y - 10, s.w + 20, 40);
        
        if (s.type === 'gas') {
            ctx.fillStyle = '#fff'; ctx.fillRect(s.x + 20, s.y + 60, 30, 40); ctx.fillRect(s.x + s.w - 50, s.y + 60, 30, 40);
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(s.x + 25, s.y + 65, 20, 10); ctx.fillRect(s.x + s.w - 45, s.y + 65, 20, 10);
        } else if (s.type === 'garage') {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(s.x + 20, s.y + s.h - 40, s.w - 40, 40);
            ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
            for(let i=0; i<5; i++) { ctx.beginPath(); ctx.moveTo(s.x + 20, s.y + s.h - 30 + i*7); ctx.lineTo(s.x + s.w - 20, s.y + s.h - 30 + i*7); ctx.stroke(); }
        } else {
            ctx.fillStyle = '#1a1a2e'; ctx.fillRect(s.x + 20, s.y + 60, 30, 40); ctx.fillRect(s.x + s.w - 50, s.y + 60, 30, 40);
            ctx.fillStyle = '#111'; ctx.fillRect(s.x + s.w/2 - 25, s.y + s.h - 30, 50, 30);
        }
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
        ctx.fillText(s.name, s.x + s.w/2, s.y + 20);
      }
    });

    if (mission.active) {
      ctx.strokeStyle = 'rgba(46, 204, 113, 0.6)'; ctx.lineWidth = 3; ctx.setLineDash([15, 15]);
      ctx.beginPath(); ctx.moveTo(car.x, car.y); ctx.lineTo(mission.destX, mission.destY); ctx.stroke();
      ctx.setLineDash([]);
      const pulse = Math.sin(Date.now() / 200) * 10 + 20;
      ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(mission.destX, mission.destY, pulse + 10, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(46, 204, 113, 0.3)'; ctx.beginPath(); ctx.arc(mission.destX, mission.destY, pulse, 0, Math.PI*2); ctx.fill();
    }

    skidmarks.forEach(mark => {
      ctx.save(); ctx.translate(mark.x, mark.y); ctx.rotate(mark.angle);
      ctx.fillStyle = `rgba(0,0,0,${mark.life * 0.5})`; ctx.fillRect(-15, -30, 10, 20); ctx.fillRect(-15, 10, 10, 20);
      ctx.restore();
    });

    if (egor.state !== 'inCar') drawHuman(egor.x, egor.y, egor.color, egor.name, egor.walkCycle, false, egor.angle);
    if (!gameState.inCar) drawHuman(player.x, player.y, player.color, player.name, player.walkCycle, true, player.angle);
    drawCar();

    particles.forEach(p => {
      ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    });

    ctx.restore(); // Возвращаем камеру

    // --- ДЕНЬ / НОЧЬ (Оверлей) ---
    let timeData = getTimeData();
    if (timeData.alpha > 0) {
        ctx.fillStyle = `rgba(10, 15, 30, ${timeData.alpha})`;
        ctx.fillRect(0, 0, W, H);
    }

    drawMinimap();
  }

  function gameLoop() { update(); draw(); updateHUD(); requestAnimationFrame(gameLoop); }

  function openDialogue(title, choices) {
    gameState.activePanel = 'dialogue'; document.getElementById('dialogue-panel').style.display = 'flex';
    document.getElementById('dialogue-title').textContent = title;
    const container = document.getElementById('dialogue-choices'); container.innerHTML = '';
    choices.forEach(c => {
      const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = c.text; btn.onclick = c.action;
      container.appendChild(btn);
    });
  }
  function closeDialogue() { gameState.activePanel = null; document.getElementById('dialogue-panel').style.display = 'none'; }

  function openShop(shop) {
    gameState.activePanel = 'shop'; document.getElementById('shop-panel').style.display = 'flex';
    document.getElementById('shop-title').textContent = shop.name;
    const container = document.getElementById('shop-items'); container.innerHTML = '';
    
    if (shop.type === 'food') {
        shop.items.forEach(item => {
          const btn = document.createElement('button'); btn.className = 'btn';
          btn.innerHTML = `${item.name} — ${item.price} ₽ (+${item.mood} настроения)`;
          btn.onclick = () => {
            if (stats.money >= item.price) {
              stats.money -= item.price; stats.mood += item.mood;
              if (stats.mood > 100) stats.mood = 100;
              updateHUD(); alert(`Вы купили: ${item.name}.`);
            } else { alert("Недостаточно денег!"); }
          };
          container.appendChild(btn);
        });
    } else if (shop.type === 'gas') {
        const btn = document.createElement('button'); btn.className = 'btn';
        btn.innerHTML = `Заправить полный бак — 200 ₽`;
        btn.onclick = () => {
            if (stats.money >= 200) {
                stats.money -= 200; car.fuel = car.maxFuel;
                updateHUD(); alert("Бак заправлен!");
            } else { alert("Недостаточно денег!"); }
        };
        container.appendChild(btn);
    } else if (shop.type === 'garage') {
        const btn1 = document.createElement('button'); btn1.className = 'btn';
        btn1.innerHTML = `Покрасить машину — 500 ₽`;
        btn1.onclick = () => {
            if (stats.money >= 500) {
                stats.money -= 500;
                car.color = car.color === '#0a0a0a' ? '#2980b9' : (car.color === '#2980b9' ? '#c0392b' : '#0a0a0a');
                updateHUD(); alert("Машина покрашена!");
            } else { alert("Недостаточно денег!"); }
        };
        const btn2 = document.createElement('button'); btn2.className = 'btn';
        btn2.innerHTML = `Прокачать двигатель (+5 скорости) — 1500 ₽`;
        btn2.onclick = () => {
            if (stats.money >= 1500) {
                stats.money -= 1500; car.maxSpeed += 5;
                updateHUD(); alert("Двигатель прокачан!");
            } else { alert("Недостаточно денег!"); }
        };
        container.appendChild(btn1); container.appendChild(btn2);
    }
  }
  function closeShop() { gameState.activePanel = null; document.getElementById('shop-panel').style.display = 'none'; }

  gameLoop();
</script>
