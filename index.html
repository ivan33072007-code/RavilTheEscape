<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adventure 2D - Novy Byt Ultimate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; background: #2d5a27; }
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

  #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-weight: bold; font-size: 18px; text-shadow: 0 2px 4px #000; pointer-events: none; }
  #hud div { margin-bottom: 5px; }
  .stat-value { color: #f1c40f; }
  
  #hud-inventory { margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.6); border-radius: 5px; border-left: 4px solid #3498db; font-size: 14px; display: none; }
  .inv-item { color: #3498db; margin-left: 10px; }

  #hud-quest { color: #2ecc71; margin-top: 10px; display: none; text-shadow: 0 0 5px #000; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; border-left: 4px solid #2ecc71; font-size: 15px; }

  #stamina-label { font-size: 12px; color: #aaa; margin-top: 8px; margin-bottom: 2px; }
  #stamina-container { width: 150px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #555; border-radius: 5px; overflow: hidden; }
  #stamina-bar { width: 100%; height: 100%; background: #e67e22; transition: width 0.1s; }

  #fuel-label { font-size: 14px; color: #aaa; margin-top: 8px; margin-bottom: 2px; display: flex; justify-content: space-between; width: 200px; }
  #fuel-bar-container { width: 200px; height: 12px; background: rgba(0,0,0,0.5); border: 1px solid #555; border-radius: 6px; overflow: hidden; display: none; }
  #fuel-bar { width: 100%; height: 100%; background: #3498db; transition: width 0.1s; }
  #fuel-range { font-size: 11px; color: #888; margin-top: 2px; }

  #health-label { font-size: 14px; color: #aaa; margin-top: 8px; margin-bottom: 2px; display: flex; justify-content: space-between; width: 200px; }
  #health-bar-container { width: 200px; height: 12px; background: rgba(0,0,0,0.5); border: 1px solid #555; border-radius: 6px; overflow: hidden; display: none; }
  #health-bar { width: 100%; height: 100%; background: #2ecc71; transition: width 0.1s; }

  #clock { position: absolute; bottom: 30px; right: 30px; color: #fff; font-weight: bold; font-size: 28px; text-shadow: 0 2px 10px #000; pointer-events: none; letter-spacing: 2px; }

  #notification { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; border: 2px solid #f1c40f; display: none; z-index: 300; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }

  #respawn-btn { position: absolute; top: 20px; right: 80px; pointer-events: auto; width: 50px; height: 50px; border-radius: 50%; background: rgba(30, 30, 30, 0.8); color: #fff; border: 2px solid #e74c3c; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.2s; }
  #respawn-btn:hover { background: rgba(231, 76, 60, 0.8); }

  #settings-btn { position: absolute; top: 20px; right: 20px; pointer-events: auto; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.2s; }
  #settings-btn:hover { background: #fff; color: #000; }

  #settings-panel { position: absolute; top: 80px; right: 20px; pointer-events: auto; background: rgba(15, 15, 20, 0.95); border: 2px solid #f1c40f; border-radius: 10px; padding: 20px; color: #fff; display: none; flex-direction: column; gap: 10px; z-index: 200; width: 340px; }
  #settings-panel h3 { color: #f1c40f; margin-bottom: 10px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .control-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; align-items: center; }
  .key { background: #333; padding: 2px 8px; border-radius: 4px; border: 1px solid #555; font-weight: bold; color: #f1c40f; }
  input[type=range] { width: 120px; cursor: pointer; }

  #interaction-hint { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #f1c40f; padding: 10px 20px; border-radius: 20px; font-weight: bold; border: 1px solid #f1c40f; display: none; pointer-events: auto; text-shadow: 0 1px 2px #000; text-align: center; }

  .panel { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; background: rgba(15, 15, 20, 0.95); border: 2px solid #f1c40f; border-radius: 10px; padding: 20px; color: #fff; display: none; flex-direction: column; gap: 15px; pointer-events: auto; z-index: 100; max-height: 70vh; overflow-y: auto; }
  .panel-title { font-size: 22px; color: #f1c40f; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: center; position: sticky; top: 0; background: rgba(15, 15, 20, 0.95); z-index: 10;}
  .panel-text { font-size: 16px; line-height: 1.5; }
  .panel-buttons { display: flex; flex-direction: column; gap: 10px; }
  .btn { background: #333; color: #fff; border: 1px solid #555; padding: 12px; border-radius: 5px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .btn:hover { background: #444; border-color: #fff; }
  .btn-price { color: #2ecc71; font-weight: bold; }
  .btn-disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<audio id="bg-music" loop src="music1.mp3"></audio>

<div id="ui-layer">
  <div id="notification">Уведомление</div>

  <div id="hud">
    <div>Деньги: <span class="stat-value" id="hud-money">2000</span> ₽</div>
    <div>Настроение: <span class="stat-value" id="hud-mood">50</span>%</div>
    
    <div id="stamina-label">Выносливость:</div>
    <div id="stamina-container"><div id="stamina-bar"></div></div>
    
    <div id="fuel-label">
        <span>Бензин:</span>
        <span id="fuel-text">50 / 50 Л</span>
    </div>
    <div id="fuel-bar-container"><div id="fuel-bar"></div></div>
    <div id="fuel-range">Хватит на ~5000 км</div>
    
    <div id="health-label">
        <span>Прочность:</span>
        <span id="health-text">100%</span>
    </div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
    
    <div id="hud-inventory">
      Инвентарь:
      <div id="inventory-list"></div>
    </div>

    <div id="hud-quest">Задание: Нет</div>
  </div>

  <div id="clock">06:00</div>

  <button id="respawn-btn" onclick="respawnCar(true)" title="Эвакуация (100 ₽)">🔄</button>
  <button id="settings-btn" onclick="toggleSettings()">⚙️</button>

  <div id="settings-panel">
    <h3>Управление</h3>
    <div class="control-row"><span>Движение:</span> <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></span></div>
    <div class="control-row"><span>Бег / Нитро:</span> <span><span class="key">Shift</span></span></div>
    <div class="control-row"><span>Фары:</span> <span><span class="key">L</span></span></div>
    <div class="control-row"><span>Двигатель:</span> <span><span class="key">Q</span></span></div>
    <div class="control-row"><span>Действие:</span> <span><span class="key">E</span></span></div>
    <div class="control-row"><span>Выйти из авто:</span> <span><span class="key">F</span></span></div>
    <div class="control-row"><span>Музыка:</span> <span><span class="key">M</span></span></div>
    
    <div class="control-row" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
      <span>Громкость:</span> <input type="range" id="vol-music" min="0" max="1" step="0.05" value="0.3">
    </div>
  </div>

  <div id="interaction-hint">Нажмите [E]</div>

  <div class="panel" id="dialogue-panel">
    <div class="panel-title" id="dialogue-title">Диалог</div>
    <div class="panel-text" id="dialogue-text"></div>
    <div class="panel-buttons" id="dialogue-choices"></div>
  </div>

  <div class="panel" id="shop-panel">
    <div class="panel-title" id="shop-title">Меню</div>
    <div class="panel-buttons" id="shop-items"></div>
    <button class="btn" style="margin-top: 10px; justify-content: center; border-color: #e74c3c;" onclick="closeShop()">Закрыть</button>
  </div>
</div>

<script>
  // Полифилл для roundRect на старых браузерах
  if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      let tl, tr, br, bl;
      if (typeof r === 'number') { tl = tr = br = bl = r; }
      else { tl = r.tl || 0; tr = r.tr || 0; br = r.br || 0; bl = r.bl || 0; }
      this.moveTo(x + tl, y); this.lineTo(x + w - tr, y); this.quadraticCurveTo(x + w, y, x + w, y + tr);
      this.lineTo(x + w, y + h - br); this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      this.lineTo(x + bl, y + h); this.quadraticCurveTo(x, y + h, x, y + h - bl);
      this.lineTo(x, y + tl); this.quadraticCurveTo(x, y, x + tl, y);
    };
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const bgMusic = document.getElementById('bg-music');
  bgMusic.volume = 0.3;
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  // ==========================================
  // ВРЕМЯ И ПОГОДА
  // ==========================================
  const DAY_DURATION = 10 * 60 * 1000;
  const NIGHT_DURATION = 5 * 60 * 1000;
  const TOTAL_CYCLE = DAY_DURATION + NIGHT_DURATION;
  const gameStartTime = Date.now();

  let weather = { isRaining: false, rainIntensity: 0 };
  let rainDrops = [];

  function updateWeather() {
    if (!weather.isRaining && Math.random() < 0.0005) {
      weather.isRaining = true;
      showNotif("Начался дождь! Сцепление с дорогой ухудшилось.", "#3498db");
    } else if (weather.isRaining && Math.random() < 0.0002) {
      weather.isRaining = false;
      showNotif("Дождь прекратился.", "#f1c40f");
    }
    
    if (weather.isRaining) {
      weather.rainIntensity = Math.min(1, weather.rainIntensity + 0.01);
      if (rainDrops.length < 200 && Math.random() < 0.5) {
        rainDrops.push({ x: Math.random() * W, y: Math.random() * -H, speed: 15 + Math.random() * 10, length: 10 + Math.random() * 20 });
      }
      for (let i = rainDrops.length - 1; i >= 0; i--) {
        rainDrops[i].y += rainDrops[i].speed;
        rainDrops[i].x -= rainDrops[i].speed * 0.2; // Ветер
        if (rainDrops[i].y > H) {
          rainDrops[i].y = -rainDrops[i].length;
          rainDrops[i].x = Math.random() * W;
        }
      }
    } else {
      weather.rainIntensity = Math.max(0, weather.rainIntensity - 0.01);
      rainDrops = [];
    }
  }

  function getTimeData() {
    let elapsed = Date.now() - gameStartTime;
    let cycleTime = elapsed % TOTAL_CYCLE;
    let isNight = false; let alpha = 0; let gameHour = 0;

    if (cycleTime < DAY_DURATION) {
      let progress = cycleTime / DAY_DURATION;
      gameHour = 6 + progress * 12;
      if (progress < 0.05) alpha = (0.05 - progress) / 0.05 * 0.75;
      else if (progress > 0.95) alpha = (progress - 0.95) / 0.05 * 0.75;
    } else {
      let progress = (cycleTime - DAY_DURATION) / NIGHT_DURATION;
      gameHour = 18 + progress * 12;
      if (gameHour >= 24) gameHour -= 24;
      alpha = 0.75;
      if (progress < 0.1) alpha = 0.75 * (progress / 0.1);
      else if (progress > 0.9) alpha = 0.75 * (1 - (progress - 0.9) / 0.1);
      isNight = true;
    }
    let h = Math.floor(gameHour).toString().padStart(2, '0');
    let m = Math.floor((gameHour % 1) * 60).toString().padStart(2, '0');
    return { isNight, alpha, timeString: `${h}:${m}` };
  }

  // ==========================================
  // АУДИО
  // ==========================================
  let audioCtx, masterGain, engineOsc1, engineOsc2, engineGain, engineFilter;
  let ambientOsc, ambientGain;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);

      engineOsc1 = audioCtx.createOscillator(); engineOsc2 = audioCtx.createOscillator();
      engineGain = audioCtx.createGain(); engineFilter = audioCtx.createBiquadFilter();
      engineOsc1.type = 'sawtooth'; engineOsc2.type = 'square'; engineOsc2.detune.value = 15;
      engineFilter.type = 'lowpass'; engineFilter.frequency.value = 400;
      engineOsc1.connect(engineFilter); engineOsc2.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(masterGain);
      engineOsc1.start(); engineOsc2.start(); engineGain.gain.value = 0;

      ambientOsc = audioCtx.createOscillator(); ambientGain = audioCtx.createGain();
      ambientOsc.type = 'triangle'; ambientOsc.frequency.value = 150; ambientGain.gain.value = 0.015;
      ambientOsc.connect(ambientGain); ambientGain.connect(masterGain); ambientOsc.start();
    }
  }

  function playFootstep() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.08;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 400; filter.Q.value = 1.0;
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    noise.connect(filter); filter.connect(gain); gain.connect(masterGain); noise.start(now);
  }

  function startEngineSound() {
    initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
    engineGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.2);
  }
  function stopEngineSound() { if (engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }

  function updateEngineSound(speed) {
    if (!audioCtx || !engineOsc1) return;
    const baseFreq = 50; const maxFreq = 250;
    const freq = baseFreq + (Math.abs(speed) / car.maxSpeed) * (maxFreq - baseFreq);
    engineOsc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
    engineOsc2.frequency.setTargetAtTime(freq * 0.5, audioCtx.currentTime, 0.1);
    engineFilter.frequency.setTargetAtTime(300 + (Math.abs(speed) * 30), audioCtx.currentTime, 0.1);
  }

  document.getElementById('vol-music').addEventListener('input', (e) => { bgMusic.volume = parseFloat(e.target.value); });

  // ==========================================
  // ЧАСТИЦЫ И ЭФФЕКТЫ
  // ==========================================
  let particles = [];
  let skidmarks = [];

  function playExhaustPop() {
    initAudio();
    if(!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(80, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.15);
    const oscGain = audioCtx.createGain(); oscGain.gain.setValueAtTime(1.5, now); oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    
    const bufferSize = audioCtx.sampleRate * 0.1;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.setValueAtTime(1000, now); noiseFilter.frequency.exponentialRampToValueAtTime(200, now + 0.1);
    const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(1.0, now); noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    
    osc.connect(oscGain); oscGain.connect(masterGain); noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);
    osc.start(now); osc.stop(now + 0.2); noise.start(now); noise.stop(now + 0.1);
    
    const rearX = car.x - Math.cos(car.angle) * (car.width/2); const rearY = car.y - Math.sin(car.angle) * (car.height/2);
    for(let i=0; i<15; i++) { particles.push({ x: rearX + (Math.random() - 0.5) * 20, y: rearY + (Math.random() - 0.5) * 20, vx: -Math.cos(car.angle) * 8 + (Math.random() - 0.5) * 6, vy: -Math.sin(car.angle) * 8 + (Math.random() - 0.5) * 6, life: 1.0, size: 10 + Math.random() * 15, color: Math.random() > 0.5 ? '#ff5500' : '#ffaa00' }); }
  }

  function spawnSmoke() {
    if (car.health < 50 && Math.random() < 0.2) {
      let engineX = car.x + Math.cos(car.angle) * (car.width/3);
      let engineY = car.y + Math.sin(car.angle) * (car.width/3);
      particles.push({
        x: engineX, y: engineY,
        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 - 1,
        life: 1.0, size: 15 + Math.random() * 20,
        color: car.health < 20 ? '#222' : '#888'
      });
    }
  }

  // ==========================================
  // КАРТА И МИР (РАСШИРЕННАЯ)
  // ==========================================
  const WORLD_SIZE = 16000;
  const ROAD_WIDTH = 300;
  const SMALL_ROAD_WIDTH = 150;

  const roadSegments = [
    // Главные
    { x1: 8000, y1: 0, x2: 8000, y2: 16000, w: ROAD_WIDTH },
    { x1: 0, y1: 6000, x2: 16000, y2: 6000, w: ROAD_WIDTH },
    { x1: 0, y1: 10000, x2: 16000, y2: 10000, w: ROAD_WIDTH },
    // Второстепенные
    { x1: 4000, y1: 3000, x2: 4000, y2: 13000, w: SMALL_ROAD_WIDTH },
    { x1: 12000, y1: 3000, x2: 12000, y2: 13000, w: SMALL_ROAD_WIDTH },
    { x1: 1000, y1: 2000, x2: 8000, y2: 2000, w: SMALL_ROAD_WIDTH },
    { x1: 8000, y1: 4000, x2: 13000, y2: 4000, w: SMALL_ROAD_WIDTH },
    { x1: 4000, y1: 4500, x2: 8000, y2: 4500, w: SMALL_ROAD_WIDTH },
    { x1: 4000, y1: 7500, x2: 8000, y2: 7500, w: SMALL_ROAD_WIDTH },
    { x1: 8000, y1: 8000, x2: 14000, y2: 8000, w: SMALL_ROAD_WIDTH },
    { x1: 0, y1: 13000, x2: 4000, y2: 13000, w: SMALL_ROAD_WIDTH },
    { x1: 12000, y1: 12000, x2: 16000, y2: 12000, w: SMALL_ROAD_WIDTH }
  ];

  const waterAreas = [{ x: 0, y: 7500, w: 3500, h: 4000 }];
  waterAreas.forEach(w => {
    w.sparkles = [];
    for (let i = 0; i < 150; i++) w.sparkles.push({ x: w.x + Math.random()*w.w, y: w.y + Math.random()*w.h, w: 80+Math.random()*100, h: 6+Math.random()*8 });
  });

  function distToSegmentSq(px, py, x1, y1, x2, y2) {
    let l2 = (x2 - x1)**2 + (y2 - y1)**2;
    if (l2 === 0) return (px - x1)**2 + (py - y1)**2;
    let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
    t = Math.max(0, Math.min(1, t));
    return (px - (x1 + t * (x2 - x1)))**2 + (py - (y1 + t * (y2 - y1)))**2;
  }
  function isOnRoad(x, y, margin = 0) {
    for (let r of roadSegments) if (distToSegmentSq(x, y, r.x1, r.y1, r.x2, r.y2) < (r.w/2 + margin)**2) return true;
    return false;
  }
  function isInWater(x, y) {
    for (let w of waterAreas) if (x > w.x && x < w.x+w.w && y > w.y && y < w.y+w.h) {
        if (distToSegmentSq(x, y, 0, 7500, 4000, 7500) < (SMALL_ROAD_WIDTH/2 + 20)**2) return false;
        if (distToSegmentSq(x, y, 0, 10000, 4000, 10000) < (ROAD_WIDTH/2 + 20)**2) return false;
        return true;
    }
    return false;
  }

  // ==========================================
  // ИГРОВЫЕ ДАННЫЕ
  // ==========================================
  let gameState = { inCar: false, activePanel: null, activeQuest: null };
  let stats = { money: 2000, mood: 50, hasNitro: false, inventory: [] };
  
  const player = { x: 7800, y: 6200, angle: -Math.PI/2, speed: 0, walkSpeed: 1.0, sprintSpeed: 2.0, accel: 0.08, friction: 0.85, turnSpeed: 0.15, color: '#3498db', name: "Равиль", walkCycle: 0, stamina: 100, maxStamina: 100, isSprinting: false, radius: 18, lastStepTrigger: 0 };
  
  const car = { 
    x: 8200, y: 6200, angle: -Math.PI/2, vx: 0, vy: 0, speed: 0, 
    maxSpeed: 22, accel: 0.22, turnSpeed: 0.05, grip: 0.15, drag: 0.97, 
    width: 150, height: 75, color: '#0a0a0a', isEngineOn: false, headlights: false, lastGear: 0, 
    fuel: 50, maxFuel: 50, consumption: 0.0001, health: 100, maxHealth: 100
  };
  
  const camera = { x: 0, y: 0 };
  const keys = {};
  const trees = [];
  const houses = [];

  function initWorld() {
    // Дома и деревья
    for (let x = 1000; x < WORLD_SIZE; x += 350) {
        for (let y = 1000; y < WORLD_SIZE; y += 350) {
            if (Math.hypot(x - player.x, y - player.y) < 600) continue;
            if (isOnRoad(x, y, 100) || isInWater(x, y)) continue;
            
            let overlap = false;
            for(let s of locations) { if (x < s.x + s.w + 100 && x + 150 > s.x - 100 && y < s.y + s.h + 100 && y + 150 > s.y - 100) overlap = true; }
            
            if (!overlap) {
                if (Math.random() > 0.6) trees.push({ x, y, r: 30 + Math.random()*20 });
                else {
                    let hw = 80 + Math.random()*60, hh = 80 + Math.random()*60;
                    if (!isOnRoad(x+hw, y, 40) && !isOnRoad(x, y+hh, 40) && !isOnRoad(x+hw, y+hh, 40)) {
                        houses.push({ x, y, w: hw, h: hh, color: `hsl(${Math.random()*360}, 15%, 35%)` });
                    }
                }
            }
        }
    }
    
    // Фонари вдоль главных дорог
    for (let i = 2000; i < WORLD_SIZE; i += 400) {
        if (!isInWater(i, 6000)) streetLights.push({ x: i, y: 5800 });
        if (!isInWater(i, 10000)) streetLights.push({ x: i, y: 9800 });
        if (!isInWater(8000, i)) streetLights.push({ x: 7800, y: i });
    }
  }
  initWorld();

  // ==========================================
  // УПРАВЛЕНИЕ И UI

  window.addEventListener('blur', () => { for(let k in keys) keys[k] = false; });
  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    keys[key] = true;
    
    if (key === 'e' || key === 'у') { if (!gameState.activePanel) interact(); e.preventDefault(); }
    if (key === 'f' || key === 'а') { if (!gameState.activePanel) exitCar(); e.preventDefault(); }
    if (key === 'q' || key === 'й') { if (gameState.inCar && !gameState.activePanel) toggleEngine(); e.preventDefault(); }
    if (key === 'l' || key === 'д') { if (gameState.inCar && !gameState.activePanel) { car.headlights = !car.headlights; showNotif(car.headlights ? "Фары включены" : "Фары выключены", "#3498db"); } e.preventDefault(); }
    if (key === 'm' || key === 'ь') { bgMusic.muted = !bgMusic.muted; e.preventDefault(); }
    
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift', ' '].includes(key)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  function isUp() { return keys['w'] || keys['ц'] || keys['arrowup']; }
  function isDown() { return keys['s'] || keys['ы'] || keys['arrowdown']; }
  function isLeft() { return keys['a'] || keys['ф'] || keys['arrowleft']; }
  function isRight() { return keys['d'] || keys['в'] || keys['arrowright']; }

  function showNotif(text, color = '#f1c40f') {
    const n = document.getElementById('notification');
    n.textContent = text; n.style.borderColor = color; n.style.color = color;
    n.style.display = 'block'; n.style.opacity = '1'; n.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(window.notifTimeout);
    window.notifTimeout = setTimeout(() => {
        n.style.opacity = '0'; n.style.transform = 'translateX(-50%) translateY(-20px)';
        setTimeout(() => n.style.display = 'none', 300);
    }, 3000);
  }

    // Инвентарь

  function toggleEngine() {
    if (car.fuel <= 0) { showNotif("Нет бензина!", "#e74c3c"); return; }
    if (car.health <= 0) { showNotif("Машина сломана! Нужен ремонт.", "#e74c3c"); return; }
    car.isEngineOn = !car.isEngineOn;
    if (car.isEngineOn) { startEngineSound(); if (!bgMusic.muted) bgMusic.play().catch(e => {}); } 
    else { stopEngineSound(); bgMusic.pause(); }
  }

  function respawnCar(isManual = false) {
    if (isManual && stats.money >= 100) { stats.money -= 100; showNotif("Эвакуация: -100 ₽", "#e74c3c"); }
    car.x = 8200; car.y = 6200; car.vx = 0; car.vy = 0; car.angle = -Math.PI/2; car.isEngineOn = false;
    player.x = 7800; player.y = 6200; gameState.inCar = false;
    stopEngineSound(); bgMusic.pause(); bgMusic.currentTime = 0;

  function interact() {
    if (gameState.activePanel) return;

    if (gameState.inCar) {
      for (let loc of locations) {
        if (Math.hypot(car.x - (loc.x + loc.w/2), car.y - (loc.y + loc.h/2)) < 250) {
            if (loc.type === 'gas') openGasMenu();
            else if (loc.type === 'garage') openGarageMenu();
            return;
        }
      }
    } else {
      for (let loc of locations) {
        if (player.x > loc.x - 50 && player.x < loc.x + loc.w + 50 && player.y > loc.y - 50 && player.y < loc.y + loc.h + 50) {
          if (loc.type === 'shop') openShopMenu(loc);
          else if (loc.type === 'shawarma') openShawarmaMenu();
          else if (loc.type === 'landmark') showNotif("Это историческое место.", "#bdc3c7");
          return;
        }
      }
      
      const distToCar = Math.hypot(player.x - car.x, player.y - car.y);
      if (distToCar < 160) { gameState.inCar = true; player.isSprinting = false; player.speed = 0; return; }

      for (let npc of npcs) {
        if (npc.state !== 'inCar' && Math.hypot(player.x - npc.x, player.y - npc.y) < 80) {
          openDialogue(npc); return;
        }
      }
    }
  }

  function exitCar() {
    if (gameState.activePanel) return;
    if (gameState.inCar) {
      gameState.inCar = false; car.speed = 0; car.vx = 0; car.vy = 0; car.isEngineOn = false;
      stopEngineSound(); bgMusic.pause(); bgMusic.currentTime = 0;
      player.x = car.x + 100; player.y = car.y + 100;
    }
  }

  // ==========================================
  // ФИЗИКА
  // ==========================================
  function getCarCircles(cx, cy) {
    return [
      { x: cx + Math.cos(car.angle) * 45, y: cy + Math.sin(car.angle) * 45, r: 35 },
      { x: cx, y: cy, r: 38 },
      { x: cx - Math.cos(car.angle) * 45, y: cy - Math.sin(car.angle) * 45, r: 35 }
    ];
  }

  function checkCarCollisions(cx, cy) {
    let circles = getCarCircles(cx, cy);
    // Магазины
    for (let loc of locations) {
      for (let c of circles) {
        let closestX = Math.max(loc.x, Math.min(c.x, loc.x + loc.w));
        let closestY = Math.max(loc.y, Math.min(c.y, loc.y + loc.h));
        if ((c.x - closestX)**2 + (c.y - closestY)**2 < c.r**2) return true;
      }
    }
    // Дома
    for (let h of houses) {
      if (Math.abs(h.x - cx) > 200 || Math.abs(h.y - cy) > 200) continue;
      for (let c of circles) {
        let closestX = Math.max(h.x, Math.min(c.x, h.x + h.w));
        let closestY = Math.max(h.y, Math.min(c.y, h.y + h.h));
        if ((c.x - closestX)**2 + (c.y - closestY)**2 < c.r**2) return true;
      }
    }
    // Деревья
    for (let t of trees) {
      if (Math.abs(t.x - cx) > 200 || Math.abs(t.y - cy) > 200) continue;
      for (let c of circles) {
        if (Math.hypot(c.x - t.x, c.y - t.y) < c.r + t.r * 0.3) return true; // Столкновение только со стволом
      }
    }
    // NPC
    for (let npc of npcs) {
        if(npc.state === 'inCar') continue;
        for (let c of circles) if (Math.hypot(c.x - npc.x, c.y - npc.y) < c.r + npc.radius) return true;
    }
    return false;
  }

  function update() {
    updateWeather();
    if (gameState.activePanel) return;

    // Частицы
    for(let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.04; if(p.life <= 0) particles.splice(i, 1); }
    for(let i = skidmarks.length - 1; i >= 0; i--) { skidmarks[i].life -= 0.01; if(skidmarks[i].life <= 0) skidmarks.splice(i, 1); }

    // Дым при поломке
    spawnSmoke();

    // Квесты по локациям
    if (gameState.activeQuest && gameState.inCar) {
        if (gameState.activeQuest.id === 'pasha') {
            let museum = locations.find(l => l.id === 'museum');
            if (Math.hypot(car.x - museum.x, car.y - museum.y) < 250) {
                stats.money += 800; gameState.activeQuest = null;
                showNotif("Паша: Спасибо, брат! +800 ₽", "#2ecc71");
                let p = npcs.find(n => n.id === 'pasha'); p.state = 'idle'; p.x = car.x + 80; p.y = car.y + 80;
            }
        }
        if (gameState.activeQuest.id === 'shelukha') {
            let mem = locations.find(l => l.id === 'memorial');
            if (Math.hypot(car.x - mem.x, car.y - mem.y) < 250) {
                stats.money += 2000; gameState.activeQuest = null;
                showNotif("Шелуха: Чисто! Держи наличку. +2000 ₽", "#2ecc71");
            }
        }
        if (gameState.activeQuest.id === 'gosha') {
            let lenta = locations.find(l => l.id === 'lenta');
            if (Math.hypot(car.x - lenta.x, car.y - lenta.y) < 300) {
                stats.money += 300; gameState.activeQuest = null;
                showNotif("Гоша: Спасибо, шеф! +300 ₽", "#2ecc71");
                let g = npcs.find(n => n.id === 'gosha'); g.state = 'idle'; g.x = car.x + 80; g.y = car.y + 80;
            }
        }
    }

    if (gameState.inCar) {
      if (car.isEngineOn && car.health > 0) {
        car.fuel -= car.consumption + (Math.abs(car.speed) * 0.00005);
        if (car.fuel <= 0) { car.fuel = 0; toggleEngine(); showNotif("Бензин кончился!", "#e74c3c"); }

        let engineForce = 0;
        if (isUp()) engineForce = car.accel;
        if (isDown()) engineForce = -car.accel * 0.6;
        
        if (stats.hasNitro && keys['shift'] && engineForce > 0) engineForce *= 2.5;

        car.vx += Math.cos(car.angle) * engineForce; car.vy += Math.sin(car.angle) * engineForce;
        car.speed = car.vx * Math.cos(car.angle) + car.vy * Math.sin(car.angle);
        
        if (Math.abs(car.speed) > 0.5) {
          let turnFactor = Math.min(1, Math.abs(car.speed) / 15); let currentTurn = car.turnSpeed * turnFactor;
          if (isLeft()) car.angle -= currentTurn * (car.speed > 0 ? 1 : -1);
          if (isRight()) car.angle += currentTurn * (car.speed > 0 ? 1 : -1);
        }

        let forwardX = Math.cos(car.angle); let forwardY = Math.sin(car.angle);
        let rightX = Math.cos(car.angle + Math.PI/2); let rightY = Math.sin(car.angle + Math.PI/2);
        let vForward = car.vx * forwardX + car.vy * forwardY; let vLateral = car.vx * rightX + car.vy * rightY;

        // Снижаем сцепление в дождь
        let currentGrip = weather.isRaining ? car.grip * 0.5 : car.grip;
        let currentDrag = weather.isRaining ? car.drag * 0.98 : car.drag;

        if (Math.abs(vLateral) > 2 && Math.abs(car.speed) > 3) skidmarks.push({ x: car.x, y: car.y, angle: car.angle, life: 1 });
        vLateral *= currentGrip; vForward *= 0.99; 
        car.vx = vForward * forwardX + vLateral * rightX; car.vy = vForward * forwardY + vLateral * rightY;
        car.vx *= currentDrag; car.vy *= currentDrag;

        let curSpeed = Math.hypot(car.vx, car.vy);
        let maxS = stats.hasNitro && keys['shift'] ? car.maxSpeed * 1.5 : car.maxSpeed;
        if (curSpeed > maxS) { car.vx = (car.vx / curSpeed) * maxS; car.vy = (car.vy / curSpeed) * maxS; }

        let gear = Math.floor(curSpeed / 3);
        if (gear > car.lastGear && car.speed > 0) playExhaustPop();
        car.lastGear = gear;

        let oldX = car.x; car.x += car.vx;
        if (checkCarCollisions(car.x, car.y)) { 
            car.x = oldX; car.vx *= -0.3; 
            if (Math.abs(car.speed) > 10) { car.health = Math.max(0, car.health - 5); showNotif("Авария! -5% прочности", "#e74c3c"); }
        }
        let oldY = car.y; car.y += car.vy;
        if (checkCarCollisions(car.x, car.y)) { 
            car.y = oldY; car.vy *= -0.3; 
            if (Math.abs(car.speed) > 10) car.health = Math.max(0, car.health - 5);
        }

        if (isInWater(car.x, car.y)) {
            showNotif("Машина утонула, Равиль на вас зол!", "#e74c3c");
            stats.mood = Math.max(0, stats.mood - 30);
            respawnCar(); return;
        }
        updateEngineSound(curSpeed);
      } else {
        car.speed = 0; car.vx = 0; car.vy = 0;
      }
      player.x = car.x; player.y = car.y; player.stamina = Math.min(player.maxStamina, player.stamina + 1);
    } else {
      if (engineGain && engineGain.gain.value > 0) stopEngineSound();

      let dx = 0, dy = 0;
      if (isUp()) dy -= 1; if (isDown()) dy += 1; if (isLeft()) dx -= 1; if (isRight()) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy); dx /= len; dy /= len;
        let targetAngle = Math.atan2(dy, dx); let angleDiff = targetAngle - player.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2; while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        if (Math.abs(angleDiff) > 0.05) player.angle += angleDiff * player.turnSpeed; else player.angle = targetAngle;
        
        if (keys['shift'] && player.stamina > 0) {
          player.isSprinting = true; player.stamina -= 0.8; player.speed += player.accel;
          if (player.speed > player.sprintSpeed) player.speed = player.sprintSpeed;
        } else {
          player.isSprinting = false; player.speed += player.accel;
          if (player.speed > player.walkSpeed) player.speed = player.walkSpeed;
        }
        player.walkCycle += player.speed * 0.3;

        let currentSin = Math.sin(player.walkCycle);
        if (Math.abs(currentSin) > 0.95 && Math.abs(player.lastStepTrigger) <= 0.95) playFootstep();
        player.lastStepTrigger = currentSin;
      } else {
        player.isSprinting = false; player.speed *= player.friction;
        if (player.speed < 0.1) player.speed = 0;
        player.walkCycle = 0; player.stamina = Math.min(player.maxStamina, player.stamina + 0.5);
      }

      let nextX = player.x + Math.cos(player.angle) * player.speed; let nextY = player.y + Math.sin(player.angle) * player.speed;
      let hitX = false; player.x = nextX;
      
      for (let loc of locations) {
        let cx = Math.max(loc.x, Math.min(player.x, loc.x + loc.w)); let cy = Math.max(loc.y, Math.min(player.y, loc.y + loc.h));
        if ((player.x - cx)**2 + (player.y - cy)**2 < player.radius**2) hitX = true;
      }
      if (isInWater(player.x, player.y)) hitX = true;
      if (hitX) player.x -= Math.cos(player.angle) * player.speed;

      let hitY = false; player.y = nextY;
      for (let loc of locations) {
        let cx = Math.max(loc.x, Math.min(player.x, loc.x + loc.w)); let cy = Math.max(loc.y, Math.min(player.y, loc.y + loc.h));
        if ((player.x - cx)**2 + (player.y - cy)**2 < player.radius**2) hitY = true;
      }
      if (isInWater(player.x, player.y)) hitY = true;
      if (hitY) player.y -= Math.sin(player.angle) * player.speed;
    }

    if (player.x < 0) player.x = 0; if (player.y < 0) player.y = 0;
    if (player.x > WORLD_SIZE) player.x = WORLD_SIZE; if (player.y > WORLD_SIZE) player.y = WORLD_SIZE;
    if (car.x < 0) car.x = 0; if (car.y < 0) car.y = 0;
    if (car.x > WORLD_SIZE) car.x = WORLD_SIZE; if (car.y > WORLD_SIZE) car.y = WORLD_SIZE;

    camera.x = player.x - W / 2; camera.y = player.y - H / 2;
    if (camera.x < 0) camera.x = 0; if (camera.y < 0) camera.y = 0;
    if (camera.x > WORLD_SIZE - W) camera.x = WORLD_SIZE - W;
    if (camera.y > WORLD_SIZE - H) camera.y = WORLD_SIZE - H;

    updateHint();
  }

  function updateHint() {
    const hint = document.getElementById('interaction-hint');
    if (gameState.activePanel) { hint.style.display = 'none'; return; }
    let text = "";
    
    if (gameState.inCar) {
      for (let loc of locations) {
        if (Math.hypot(car.x - (loc.x + loc.w/2), car.y - (loc.y + loc.h/2)) < 250) {
            if (loc.type === 'gas') text = "Нажмите [E] чтобы заправиться";
            if (loc.type === 'garage') text = "Нажмите [E] чтобы заехать в автосервис";
        }
      }
      if (!text) text = "Нажмите [F] выйти | [Q] Зажигание | [L] Фары";
    } else {
      const distToCar = Math.hypot(player.x - car.x, player.y - car.y);
      if (distToCar < 160) text = "Нажмите [E] чтобы сесть в машину";
      else {
        for (let loc of locations) {
          if (player.x > loc.x - 50 && player.x < loc.x + loc.w + 50 && player.y > loc.y - 50 && player.y < loc.y + loc.h + 50) {
            if (loc.type === 'shop' || loc.type === 'shawarma') text = "Нажмите [E] чтобы войти";
            else text = "Нажмите [E] чтобы осмотреть";
          }
        }
        for (let npc of npcs) {
          if (npc.state !== 'inCar' && Math.hypot(player.x - npc.x, player.y - npc.y) < 80) text = `Нажмите [E] чтобы поговорить`;
        }
      }
    }
    if (text) { hint.innerHTML = text; hint.style.display = 'block'; } else { hint.style.display = 'none'; }
  }

  function drawHuman(x, y, color, name, walkCycle, isRavil, angle) {
    ctx.save(); ctx.translate(x, y); 
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0, 0, 18, 9, 0, 0, Math.PI*2); ctx.fill();
    let safeAngle = isNaN(angle) ? -Math.PI/2 : angle; let a = (safeAngle + Math.PI * 2) % (Math.PI * 2); let angleDeg = a * 180 / Math.PI;
    let dir = 3; if (angleDeg >= 45 && angleDeg < 135) dir = 0; else if (angleDeg >= 135 && angleDeg < 225) dir = 1; else if (angleDeg >= 225 && angleDeg < 315) dir = 2; 
    let swing = Math.sin(walkCycle) * 0.6;

    ctx.fillStyle = '#2c3e50'; 
    if (dir === 0) {
      ctx.save(); ctx.translate(-6, -8); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(6, -8); ctx.rotate(-swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
    } else if (dir === 2) {
      ctx.save(); ctx.translate(-6, -8); ctx.rotate(-swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(6, -8); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-5, 0, 10, 16, 3); ctx.fill(); ctx.restore();
    } else { ctx.save(); ctx.translate(0, -6); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-7, 0, 14, 12, 3); ctx.fill(); ctx.restore(); }

    ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-12, -34, 24, 26, 6); ctx.fill(); 
    ctx.fillStyle = '#fcd0b3'; 
    if (dir === 0 || dir === 2) {
      ctx.save(); ctx.translate(-14, -28); ctx.rotate(-swing); ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 4); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(14, -28); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 4); ctx.fill(); ctx.restore();
    } else { ctx.save(); ctx.translate(-10, -26); ctx.rotate(swing); ctx.beginPath(); ctx.roundRect(-4, 0, 8, 18, 4); ctx.fill(); ctx.restore(); }

    ctx.fillStyle = '#fcd0b3'; ctx.beginPath(); ctx.arc(0, -46, 14, 0, Math.PI*2); ctx.fill();
    if (isRavil) {
        ctx.fillStyle = '#111';
        if (dir === 0) { ctx.beginPath(); ctx.arc(0, -48, 14, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.roundRect(-10, -48, 20, 7, 3); ctx.fill(); }
        else if (dir === 2) { ctx.beginPath(); ctx.arc(0, -48, 14, Math.PI, 0); ctx.fill(); }
        else { ctx.beginPath(); ctx.roundRect(dir === 3 ? 2 : -14, -48, 12, 7, 3); ctx.fill(); ctx.beginPath(); ctx.arc(0, -48, 14, Math.PI, 0); ctx.fill(); }
    } else {
        ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.arc(-4, -50, 10, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(4, -48, 10, Math.PI, 0); ctx.fill();
        if (dir === 0) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-5, -48, 2, 0, Math.PI*2); ctx.arc(5, -48, 2, 0, Math.PI*2); ctx.fill(); }
        else if (dir === 3) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(8, -48, 2, 0, Math.PI*2); ctx.fill(); }
        else if (dir === 1) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-8, -48, 2, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText(name, x, y - 75);
  }

  function drawCar(timeData) {
    // Тень
    ctx.save(); ctx.translate(car.x + 20, car.y + 20); ctx.rotate(car.angle);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(-car.width/2, -car.height/2, car.width, car.height, 20); ctx.fill();
    ctx.restore();

    ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
    
    // Колеса
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.roundRect(-55, -car.height/2 - 7, 28, 14, 4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(30, -car.height/2 - 7, 28, 14, 4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-55, car.height/2 - 7, 28, 14, 4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(30, car.height/2 - 7, 28, 14, 4); ctx.fill();

    // Кузов
    let grad = ctx.createLinearGradient(0, -car.height/2, 0, car.height/2);
    grad.addColorStop(0, car.color); grad.addColorStop(0.5, '#050505'); grad.addColorStop(1, car.color);
    ctx.beginPath(); ctx.roundRect(-car.width/2, -car.height/2 + 5, car.width, car.height - 10, 20);
    ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();

    // Блики
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-40, -car.height/2 + 8); ctx.lineTo(40, -car.height/2 + 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-40, car.height/2 - 8); ctx.lineTo(40, car.height/2 - 8); ctx.stroke();

    // Сиденья
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.roundRect(-30, -25, 60, 20, 5); ctx.fill(); 
    ctx.beginPath(); ctx.roundRect(-30, 5, 60, 20, 5); ctx.fill(); 

    // Водитель и пассажиры
    if (gameState.inCar) { ctx.fillStyle = '#fcd0b3'; ctx.beginPath(); ctx.arc(-5, -15, 8, 0, Math.PI*2); ctx.fill(); }
    let pasha = npcs.find(n => n.id === 'pasha');
    let gosha = npcs.find(n => n.id === 'gosha');
    if (pasha && pasha.state === 'inCar') { ctx.fillStyle = '#fcd0b3'; ctx.beginPath(); ctx.arc(-5, 15, 8, 0, Math.PI*2); ctx.fill(); }
    if (gosha && gosha.state === 'inCar') { ctx.fillStyle = '#fcd0b3'; ctx.beginPath(); ctx.arc(-5, 15, 8, 0, Math.PI*2); ctx.fill(); }

    // Лобовое стекло
    ctx.fillStyle = 'rgba(10, 15, 20, 0.85)'; 
    ctx.beginPath(); ctx.roundRect(-55, -car.height/2 + 12, 100, car.height - 24, 15); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.roundRect(-50, -car.height/2 + 15, 90, 10, 5); ctx.fill();

    // Фары и свет
    if (car.isEngineOn) {
      ctx.fillStyle = '#e0f7fa'; 
      ctx.fillRect(car.width/2 - 3, -car.height/2 + 8, 5, 12); ctx.fillRect(car.width/2 - 3, car.height/2 - 20, 5, 12); 
      
      if (car.headlights) {
          const beamLength = timeData.isNight ? 600 : 400;
          const gradFront = ctx.createLinearGradient(car.width/2, 0, car.width/2 + beamLength, 0);
          gradFront.addColorStop(0, timeData.isNight ? 'rgba(255, 255, 200, 0.7)' : 'rgba(224, 247, 250, 0.4)'); 
          gradFront.addColorStop(1, 'rgba(224, 247, 250, 0)');
          ctx.fillStyle = gradFront; 
          ctx.beginPath(); ctx.moveTo(car.width/2, -car.height/2 + 14); ctx.lineTo(car.width/2 + beamLength, -250); ctx.lineTo(car.width/2 + beamLength, 250); ctx.lineTo(car.width/2, car.height/2 - 14); ctx.fill();
      }

      ctx.fillStyle = '#ff0000'; ctx.fillRect(-car.width/2 - 2, -car.height/2 + 8, 5, 12); ctx.fillRect(-car.width/2 - 2, car.height/2 - 20, 5, 12); 
      const gradBack = ctx.createLinearGradient(-car.width/2, 0, -car.width/2 - 100, 0);
      gradBack.addColorStop(0, 'rgba(255, 0, 0, 0.3)'); gradBack.addColorStop(1, 'rgba(255, 0, 0, 0)');
      ctx.fillStyle = gradBack; ctx.beginPath(); ctx.moveTo(-car.width/2, -car.height/2 + 14); ctx.lineTo(-car.width/2 - 100, -50); ctx.lineTo(-car.width/2 - 100, 50); ctx.lineTo(-car.width/2, car.height/2 - 14); ctx.fill();
    } else {
      ctx.fillStyle = '#ccffff'; ctx.fillRect(car.width/2 - 3, -car.height/2 + 8, 5, 12); ctx.fillRect(car.width/2 - 3, car.height/2 - 20, 5, 12);
      ctx.fillStyle = '#550000'; ctx.fillRect(-car.width/2 - 2, -car.height/2 + 8, 5, 12); ctx.fillRect(-car.width/2 - 2, car.height/2 - 20, 5, 12);

  }

    ctx.save(); ctx.translate(mapX, mapY);
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, mapSize, mapSize);

    ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI*2); ctx.fill();

  function draw() {
    const timeData = getTimeData();
    ctx.fillStyle = timeData.isNight ? '#1a2a1a' : '#2d5a27'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(-camera.x, -camera.y);

    // Вода
    waterAreas.forEach(w => {
      ctx.fillStyle = '#1a5276'; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      for (let s of w.sparkles) if (s.x > camera.x - 100 && s.x < camera.x + W + 100 && s.y > camera.y - 100 && s.y < camera.y + H + 100) ctx.fillRect(s.x, s.y, s.w, s.h);
    });

    // Дороги
    for (let r of roadSegments) {
        ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2);
        ctx.lineWidth = r.w; ctx.strokeStyle = '#444'; ctx.lineCap = 'round'; ctx.stroke();
        if (r.w > 200) {
            ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2);
            ctx.lineWidth = 4; ctx.strokeStyle = '#f1c40f'; ctx.setLineDash([40, 40]); ctx.stroke(); ctx.setLineDash([]);
        }
    }

    // Дома
    houses.forEach(h => {
      if (h.x > camera.x - 300 && h.x < camera.x + W + 300 && h.y > camera.y - 300 && h.y < camera.y + H + 300) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(h.x + 10, h.y + 10, h.w, h.h);
        ctx.fillStyle = h.color; ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(h.x, h.y, h.w, 30);
      }
    });

    // Деревья
    trees.forEach(t => {
      if (t.x > camera.x - 100 && t.x < camera.x + W + 100 && t.y > camera.y - 100 && t.y < camera.y + H + 100) {
        ctx.fillStyle = '#2c1e16'; ctx.fillRect(t.x - 5, t.y, 10, 20);
        ctx.fillStyle = '#1a3b1a'; ctx.beginPath(); ctx.arc(t.x, t.y - 10, t.r, 0, Math.PI*2); ctx.fill();
      }
    });

    // Фонари
    streetLights.forEach(l => {
        if (l.x > camera.x - 100 && l.x < camera.x + W + 100 && l.y > camera.y - 100 && l.y < camera.y + H + 100) {
            ctx.fillStyle = '#555'; ctx.fillRect(l.x - 3, l.y - 40, 6, 40);
            if (timeData.isNight) {
                ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(l.x, l.y - 40, 6, 0, Math.PI*2); ctx.fill();
                const grad = ctx.createRadialGradient(l.x, l.y - 40, 0, l.x, l.y - 40, 150);
                grad.addColorStop(0, 'rgba(241, 196, 15, 0.4)'); grad.addColorStop(1, 'rgba(241, 196, 15, 0)');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(l.x, l.y - 40, 150, 0, Math.PI*2); ctx.fill();
            }
        }
    });

    // Локации
    locations.forEach(s => {
      if (s.x > camera.x - 500 && s.x < camera.x + W + 500 && s.y > camera.y - 500 && s.y < camera.y + H + 500) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(s.x + 15, s.y + 15, s.w, s.h);
        ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, s.w, s.h);
        
        if (s.type === 'landmark') {
            if (s.id === 'monastery') {
                ctx.fillStyle = '#fff'; ctx.fillRect(s.x+50, s.y+50, s.w-100, s.h-100);
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(s.x+s.w/2-10, s.y+20, 20, 100);
            }
            if (s.id === 'museum') {
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(s.x+20, s.y+20, s.w-40, s.h-40);
                ctx.fillStyle = '#f1c40f'; ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.fillText('🚜', s.x+s.w/2, s.y+s.h/2+15);
            }
            if (s.id === 'memorial') {
                ctx.fillStyle = '#555'; ctx.fillRect(s.x+s.w/2-30, s.y+20, 60, s.h-20);
            }
        } else {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(s.x + s.w/2 - 25, s.y + s.h - 30, 50, 30);
            if (s.type === 'gas') {
                ctx.fillStyle = '#fff'; ctx.fillRect(s.x + 20, s.y + 60, 30, 40); ctx.fillRect(s.x + s.w - 50, s.y + 60, 30, 40);
                ctx.fillStyle = '#e74c3c'; ctx.fillRect(s.x + 25, s.y + 65, 20, 10); ctx.fillRect(s.x + s.w - 45, s.y + 65, 20, 10);
            }
        }
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
        ctx.fillText(s.name, s.x + s.w/2, s.y + 25);
      }
    });

    // NPC
    npcs.forEach(npc => {
        if (npc.state !== 'inCar') drawHuman(npc.x, npc.y, npc.color, npc.name, 0, false, npc.angle);
    });

    if (!gameState.inCar) drawHuman(player.x, player.y, player.color, player.name, player.walkCycle, true, player.angle);
    drawCar(timeData);

    // Следы и частицы
    skidmarks.forEach(mark => {
      ctx.save(); ctx.translate(mark.x, mark.y); ctx.rotate(mark.angle);
      ctx.fillStyle = `rgba(0,0,0,${mark.life * 0.5})`; ctx.fillRect(-15, -30, 10, 20); ctx.fillRect(-15, 10, 10, 20);
      ctx.restore();
    });

    particles.forEach(p => {
      ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    });

    ctx.restore();

    // Ночь
    if (timeData.alpha > 0) {
        ctx.fillStyle = `rgba(10, 15, 30, ${timeData.alpha})`; ctx.fillRect(0, 0, W, H);
    }

    // Дождь
    if (weather.isRaining) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let drop of rainDrops) {
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x - drop.length * 0.2, drop.y + drop.length);
        }
        ctx.stroke();
    }

    drawMinimap();
  }

  function gameLoop() {
    update();
    draw();
    updateHUD();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
